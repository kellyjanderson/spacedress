name: DSAS proposal
description: Propose a change to the Desktop Switcher Appearance Specification.
title: "[DSAS]: "
body:
  - type: markdown
    attributes:
      value: |
        DSAS is the application-facing interoperability standard. SpaceDress user rules and the internal multi-app manifest are product configuration, not DSAS.
  - type: textarea
    id: use-case
    attributes:
      label: Application-facing use case
      description: What can an application not express with the current Desktop Switcher Appearance Manifest?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Proposed DSAM example
      render: json
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Rendering semantics
      description: Define behavior for single-participant and multi-participant/split representations where relevant.
    validations:
      required: true
  - type: textarea
    id: neutrality
    attributes:
      label: Interoperability / neutrality
      description: Explain why this belongs in a renderer-neutral application standard rather than SpaceDress's internal user configuration.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: What should older readers do when they see this field/layer/version?
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy
      description: Address resources, paths, external data, document metadata, and executable behavior.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Specification boundaries
      options:
        - label: The proposal remains declarative and does not execute app-supplied code or scripts.
          required: true
        - label: The proposal does not require remote assets.
          required: true
        - label: The proposal does not add SpaceDress-specific multi-app targeting or user-rule semantics to DSAS.
          required: true
